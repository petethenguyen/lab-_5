<!DOCTYPE html>
<html lang="en">
<head>
    <title>Who is Peter</title>
    <style>
        body { background-color: #f0f0f0; font-family: sans-serif; }
    </style>
</head>
<body>
    <x-highlight>Peter is Peter</x-highlight>

    <script>
        class Highlight extends HTMLElement {
            connectedCallback() {
                this.innerHTML = `<div style="background-color: yellow; padding: 10px; font-weight: bold;">${this.innerHTML}</div>`;
            }
        }
        customElements.define('x-highlight', Highlight);
    </script>
</body>
</html>
